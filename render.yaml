services:
  - type: web
    name: clinic-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    env: python
    region: oregon
    plan: free
    branch: main
    repo: https://github.com/djangolgbtqweb/clinicbackend

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

    disk:
      name: clinic-sqlite-disk
      mountPath: /persistent
      sizeGB: 1
